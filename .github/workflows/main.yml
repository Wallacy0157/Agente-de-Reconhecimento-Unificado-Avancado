name: CI Pipeline
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
 
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
 
      - name: Rodar testes
        run: |
          cd api
          mvn test
 
  build-and-push:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: test  # só executa se os testes passarem
 
    steps: 
      - uses: actions/checkout@v6.0.2
      - name: Autenticação Docker HUB
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}
      - name: Construção e push da imagem Docker
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            caiovrodrigues/agente-reconhecimento-api:latest
            caiovrodrigues/agente-reconhecimento-api:${{github.run_number}}
