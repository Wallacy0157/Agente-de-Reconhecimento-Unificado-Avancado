spring.application.name=agente-reconhecimento

spring.datasource.url=jdbc:postgresql://localhost:5432/reconhecimento
spring.datasource.username=agentereconhecimento
spring.datasource.password=agentereconhecimento

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.public-key=classpath:/rsa/public.pem
security.jwt.private-key=classpath:/rsa/private.key